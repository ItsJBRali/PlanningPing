[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-ping"
version = "0.1.0"
description = "A Windows desktop planning-application search tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter==6.0.0",
    "tkinterdnd2==0.6.2",
    "lxml",
    "selenium",
    "certifi",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pyinstaller"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
