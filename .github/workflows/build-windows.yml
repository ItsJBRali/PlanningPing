name: Build Windows executable

# PyInstaller cannot cross-compile: it embeds a platform-specific bootloader,
# so PlanningPing.exe has to be produced on Windows. This builds it on a
# GitHub-hosted Windows runner and uploads it as a downloadable artifact, so
# no one needs a Windows machine of their own to get a build.

on:
  # workflow_dispatch only becomes available once this file is on the default
  # branch, so the branch trigger is what produces a build before then.
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run the test suite
        run: |
          pip install pytest
          python -m pytest tests -q
        env:
          PYTHONPATH: src

      - name: Build PlanningPing.exe
        run: pyinstaller --noconfirm --clean PlanningPing.spec

      - name: Smoke-test the frozen executable
        # Proves the build actually starts on a clean profile: that tkdnd
        # loads, the bundled data files are found, and the database is created
        # under %LOCALAPPDATA%. A build that cannot start is worse than none.
        env:
          PLANNINGPING_SMOKE_TEST: "1"
        run: |
          .\dist\PlanningPing.exe
          if ($LASTEXITCODE -ne 0) { throw "executable exited with $LASTEXITCODE" }
          $db = Join-Path $env:LOCALAPPDATA "PlanningPing\applications.sql"
          if (-not (Test-Path $db)) { throw "expected database at $db" }
          Write-Host "started cleanly; database created at $db"

      - uses: actions/upload-artifact@v4
        with:
          name: PlanningPing-windows
          path: dist/PlanningPing.exe
          if-no-files-found: error
